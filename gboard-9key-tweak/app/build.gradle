plugins {
    id 'com.android.application'
}

android {
    namespace 'com.a23bc.gboard9key'
    compileSdk 35

    defaultConfig {
        applicationId 'com.a23bc.gboard9key'
        minSdk 27
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    buildTypes {
        debug { minifyEnabled false }
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Modern libxposed API, latest published version.
    // compileOnly: the framework supplies the implementation at runtime.
    compileOnly 'io.github.libxposed:api:102.0.0'
}
